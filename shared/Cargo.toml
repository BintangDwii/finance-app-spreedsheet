[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", optional = true, features = ["runtime-tokio", "postgres", "chrono", "uuid"] }

[features]
default = []
# Backend enables `db` for sqlx::Type derives; WASM frontend uses default (serde only).
db = ["dep:sqlx"]
