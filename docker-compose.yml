services:
  postgres:
    image: postgres:16-alpine
    container_name: corporate_postgres
    environment:
      POSTGRES_DB: corporate
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance123
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d corporate"]
      interval: 5s
      retries: 5

  # Full-Rust app: Axum API + Leptos SPA served same-origin (see backend-rust/Dockerfile).
  # Build context is the repo root; build the SPA first: `cd frontend && trunk build --release`.
  api:
    build:
      context: .
      dockerfile: backend-rust/Dockerfile
    container_name: corporate_app
    environment:
      DATABASE_URL: postgres://finance:finance123@postgres:5432/corporate
      JWT_SECRET: change-this-super-secret-jwt-key-min-32-chars
      JWT_EXP_HOURS: 24
      RUST_LOG: info
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
