version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: corporate_postgres
    environment:
      POSTGRES_DB: corporate
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance123
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d corporate"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend-rust
    container_name: corporate_api
    environment:
      DATABASE_URL: postgres://finance:finance123@postgres:5432/corporate
      JWT_SECRET: change-this-super-secret-jwt-key-min-32-chars
      JWT_EXP_HOURS: 24
      RUST_LOG: info
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
